<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF6B00" />
  <meta name="robots" content="noindex" />
  <title>Sin conexión — ProFit Studio</title>
  <!-- Página estática precacheada por /sw.js: sin CDN ni archivos externos, para que se vea sin red. -->
  <style>
    :root {
      color-scheme: dark;
      --color-bg: #000;
      --color-surface: #18181b;
      --color-border: rgba(255, 255, 255, 0.1);
      --color-text: #fff;
      --color-muted: rgba(255, 255, 255, 0.72);
      --color-primary: #FF6B00;
      --color-on-primary: #000;
      --radius: 1rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.5rem 1rem;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 28rem;
      padding: clamp(1.5rem, 5vw, 2.5rem);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      text-align: center;
    }
    .brand { margin: 0 0 1.5rem; color: var(--color-text); font-size: 1.25rem; font-weight: 900; letter-spacing: -0.01em; }
    .brand .accent { color: var(--color-primary); }
    .brand .muted { color: var(--color-muted); font-size: 0.875rem; font-weight: 300; margin-left: 0.25rem; }
    .icon { width: 3.5rem; height: 3.5rem; margin: 0 auto 1rem; color: var(--color-primary); }
    h1 { margin: 0 0 0.5rem; font-size: clamp(1.4rem, 5vw, 1.75rem); font-weight: 800; }
    p { margin: 0 0 1.5rem; color: var(--color-muted); overflow-wrap: anywhere; }
    button {
      min-height: 2.75rem;
      padding: 0.75rem 1.5rem;
      border: 0;
      border-radius: 0.75rem;
      background: var(--color-primary);
      color: var(--color-on-primary);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 3px solid var(--color-text); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Pro<span class="accent">Fit</span><span class="muted">Studio</span></p>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M2 2l20 20" />
      <path d="M8.5 16.4a5 5 0 0 1 7 0" />
      <path d="M5 12.9a10 10 0 0 1 5.2-2.8" />
      <path d="M19 12.9a10 10 0 0 0-2.3-1.6" />
      <path d="M1.4 9a15 15 0 0 1 4.3-2.6" />
      <path d="M10.7 5.1A15 15 0 0 1 22.6 9" />
      <path d="M12 20h.01" />
    </svg>
    <h1>Sin conexión</h1>
    <p>No pudimos cargar esta página porque no hay internet. Revisa tu conexión e inténtalo de nuevo.</p>
    <button type="button" id="retry">Reintentar</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
