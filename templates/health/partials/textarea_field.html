{# Texto libre corto (siempre escapado). Parámetros: name, label, value, help, placeholder, maxlength, rows. #}
<div>
  <label for="id_{{ name }}" class="block text-white/80 text-sm font-medium mb-2">
    {{ label }} <span class="text-white/60 font-normal">(opcional)</span>
  </label>
  <textarea id="id_{{ name }}" name="{{ name }}" rows="{{ rows|default:'2' }}" maxlength="{{ maxlength|default:'300' }}"
            {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
            {% if name in errors %}aria-invalid="true"{% endif %}
            {% if help or name in errors %}aria-describedby="{% if help %}help_{{ name }}{% endif %}{% if name in errors %} err_{{ name }}{% endif %}"{% endif %}
            class="w-full bg-black/40 border {% if name in errors %}border-red-500{% else %}border-white/20{% endif %} focus:border-primary focus-visible:ring-2 focus-visible:ring-primary/60 rounded-xl px-4 py-3 text-white text-sm placeholder:text-white/40 outline-none resize-none transition-colors">{{ value|default:'' }}</textarea>
  {% if help %}<p id="help_{{ name }}" class="text-white/60 text-xs leading-relaxed mt-1.5">{{ help }}</p>{% endif %}
  {% include 'health/partials/field_error.html' %}
</div>
