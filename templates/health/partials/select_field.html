{# Selector de opción única (listas largas). Parámetros: name, label, options [(código, etiqueta)], value, required, help. #}
<div>
  <label for="id_{{ name }}" class="block text-white/80 text-sm font-medium mb-2">
    {{ label }}{% if required %} <span class="text-primary" aria-hidden="true">*</span><span class="sr-only">(obligatorio)</span>{% else %} <span class="text-white/60 font-normal">(opcional)</span>{% endif %}
  </label>
  <select id="id_{{ name }}" name="{{ name }}"
          {% if name in errors %}aria-invalid="true"{% endif %}
          {% if help or name in errors %}aria-describedby="{% if help %}help_{{ name }}{% endif %}{% if name in errors %} err_{{ name }}{% endif %}"{% endif %}
          class="w-full min-h-[44px] bg-black/40 border {% if name in errors %}border-red-500{% else %}border-white/20{% endif %} focus:border-primary focus-visible:ring-2 focus-visible:ring-primary/60 rounded-xl px-3 py-3 text-white text-sm outline-none transition-colors [color-scheme:dark]">
    <option value="">Elige una opción</option>
    {% for code, label in options %}<option value="{{ code }}" {% if value == code %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
  {% if help %}<p id="help_{{ name }}" class="text-white/60 text-xs leading-relaxed mt-1.5">{{ help }}</p>{% endif %}
  {% include 'health/partials/field_error.html' %}
</div>
