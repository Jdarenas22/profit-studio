{% if count > 0 %}<span data-plan-badge role="img"
      aria-label="{{ count }} plan{{ count|pluralize:'es' }} por revisar"
      class="ml-2 flex h-5 min-w-[1.25rem] items-center justify-center rounded-full bg-primary px-1.5 text-xs font-bold leading-none tabular-nums text-black group-data-[active=true]:bg-zinc-900 group-data-[active=true]:text-white">{% if count > 99 %}99+{% else %}{{ count }}{% endif %}</span>{% endif %}
